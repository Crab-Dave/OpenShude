name: Production Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  ACR_REGISTRY: crpi-yhz9m3hwh5p9orhs.cn-shanghai.personal.cr.aliyuncs.com
  IMAGE_NAME: crpi-yhz9m3hwh5p9orhs.cn-shanghai.personal.cr.aliyuncs.com/openshude/openshude-1
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    name: Build and Push Image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs:
      - build-and-push

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload production Compose file
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            -P "$SERVER_PORT" \
            compose.prod.yml \
            "$SERVER_USER@$SERVER_HOST:/opt/myapp/compose.prod.yml.next"

          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            -P "$SERVER_PORT" \
            ops/restore-database.sh \
            "$SERVER_USER@$SERVER_HOST:/opt/myapp/restore-database.sh.next"

      - name: Deploy new image
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: |
          INITIAL_ADMIN_PASSWORD_B64=$(printf '%s' "$INITIAL_ADMIN_PASSWORD" | base64 -w0)
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_NAME='$IMAGE_NAME' INITIAL_ADMIN_PASSWORD_B64='$INITIAL_ADMIN_PASSWORD_B64' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/myapp
          INITIAL_ADMIN_PASSWORD=$(printf '%s' "$INITIAL_ADMIN_PASSWORD_B64" | base64 -d)
          export INITIAL_ADMIN_PASSWORD

          bash -n restore-database.sh.next
          IMAGE_TAG="$IMAGE_TAG" docker compose -f compose.prod.yml.next config --quiet
          docker volume create openshude-data >/dev/null
          docker volume create openshude-backups >/dev/null

          had_previous_compose=false
          if [[ -f compose.prod.yml ]]; then
            cp compose.prod.yml compose.prod.yml.rollback
            had_previous_compose=true
          fi
          mv compose.prod.yml.next compose.prod.yml

          compose() {
            local tag="$1"
            shift
            IMAGE_TAG="$tag" docker compose -f compose.prod.yml "$@" </dev/null
          }

          restore_previous_compose() {
            cp compose.prod.yml "compose.prod.yml.failed-${IMAGE_TAG}"
            if [[ "$had_previous_compose" == true ]]; then
              cp compose.prod.yml.rollback compose.prod.yml
            else
              rm -f compose.prod.yml
            fi
          }

          wait_for_healthy() {
            local tag="$1"
            local health_url="http://127.0.0.1:4173/"
            if [[ "$tag" == "$IMAGE_TAG" ]]; then
              health_url="http://127.0.0.1:4173/api/health"
            fi

            for ((attempt = 1; attempt <= 30; attempt++)); do
              container=$(compose "$tag" ps -q web)
              if [[ -n "$container" ]]; then
                status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")
                image_ref=$(docker inspect --format '{{.Config.Image}}' "$container")
                if [[ "$status" == "healthy" && "$image_ref" == "$IMAGE_NAME:$tag" ]]; then
                  if response=$(curl --fail --silent --show-error --max-time 5 "$health_url"); then
                    if [[ "$tag" != "$IMAGE_TAG" || "$response" == *"\"version\":\"$tag\""* ]]; then
                      return 0
                    fi
                  fi
                fi
              fi
              sleep 2
            done
            return 1
          }

          verify_reverse_proxy() {
            local tag="$1"
            local health_path="/"
            if [[ "$tag" == "$IMAGE_TAG" ]]; then
              health_path="/api/health"
            fi

            for ((attempt = 1; attempt <= 15; attempt++)); do
              if response=$(curl --fail --silent --show-error --max-time 5 \
                -H 'Host: 39.96.36.207' "http://127.0.0.1${health_path}"); then
                if [[ "$tag" != "$IMAGE_TAG" || "$response" == *"\"version\":\"$tag\""* ]]; then
                  return 0
                fi
              fi
              sleep 2
            done
            return 1
          }

          previous_tag=""
          current_container=$(docker ps --all --quiet --filter "name=^/openshude-web$")
          current_image_id=""
          current_was_running=false
          if [[ -n "$current_container" ]]; then
            current_image_id=$(docker inspect --format '{{.Image}}' "$current_container")
            current_was_running=$(docker inspect --format '{{.State.Running}}' "$current_container")
          fi

          if [[ -f .deployed-image-tag ]]; then
            previous_tag=$(<.deployed-image-tag)
          fi
          if [[ ! "$previous_tag" =~ ^[0-9a-f]{40}$ || "$previous_tag" == "$IMAGE_TAG" ]]; then
            previous_tag=""
            if [[ -n "$current_container" ]]; then
              previous_tag="rollback-${IMAGE_TAG:0:12}"
              docker image tag "$current_image_id" "$IMAGE_NAME:$previous_tag"
            fi
          fi

          failed=false
          backup_created=false
          backup_path=""
          if ! compose "$IMAGE_TAG" pull; then
            failed=true
          elif ! compose "$IMAGE_TAG" run -T --rm --no-deps --user root web \
            chown -R 1000:1000 /app/data /app/backups; then
            failed=true
          fi

          volume_has_data=""
          if [[ "$failed" == false ]]; then
            if ! volume_has_data=$(compose "$IMAGE_TAG" run -T --rm --no-deps --user root web \
              sh -c 'if [ -n "$(ls -A /app/data)" ]; then echo true; else echo false; fi'); then
              failed=true
            fi
          fi

          if [[ "$failed" == false && -n "$current_container" && "$volume_has_data" == false ]]; then
            echo "Migrating existing application data to the managed volume"
            docker stop "$current_container" >/dev/null
            if ! docker run --rm --user root \
              --volumes-from "$current_container:ro" \
              -v openshude-data:/target \
              "$current_image_id" \
              sh -c 'cp -a /app/data/. /target/ && chown -R 1000:1000 /target'; then
              docker run --rm --user root -v openshude-data:/target "$current_image_id" \
                sh -c 'find /target -mindepth 1 -delete' || true
              if [[ "$current_was_running" == true ]]; then
                docker start "$current_container" >/dev/null || true
              fi
              failed=true
            fi
          fi

          if [[ "$failed" == false && -n "$current_container" && "$current_was_running" == true ]]; then
            docker stop "$current_container" >/dev/null || failed=true
          fi

          database_exists=""
          if [[ "$failed" == false ]]; then
            if ! database_exists=$(compose "$IMAGE_TAG" run -T --rm --no-deps web \
              python -c 'from pathlib import Path; print("true" if Path("/app/data/app.db").is_file() else "false")'); then
              failed=true
            fi
          fi

          if [[ "$failed" == false && "$database_exists" == true ]]; then
            timestamp=$(date -u +%Y%m%dT%H%M%SZ)
            backup_path="/app/backups/predeploy-${timestamp}-${previous_tag:-untracked}.db"
            if compose "$IMAGE_TAG" run -T --rm --no-deps web \
                 python -m app.maintenance backup /app/data/app.db "$backup_path" && \
               compose "$IMAGE_TAG" run -T --rm --no-deps web \
                 python -m app.maintenance verify "$backup_path" && \
               compose "$IMAGE_TAG" run -T --rm --no-deps web \
                 python -m app.maintenance prune /app/backups 10; then
              backup_created=true
            else
              failed=true
            fi
          fi

          if [[ "$failed" == false ]] && ! compose "$IMAGE_TAG" run -T --rm --no-deps web \
            alembic upgrade head; then
            failed=true
          fi
          if [[ "$failed" == false ]] && ! compose "$IMAGE_TAG" run -T --rm --no-deps \
            -e INITIAL_ADMIN_PASSWORD web python -m app.maintenance bootstrap-admin /app/data/app.db; then
            failed=true
          fi
          if [[ "$failed" == false ]] && ! compose "$IMAGE_TAG" run -T --rm --no-deps web \
            python -m app.maintenance validate /app/data/app.db; then
            failed=true
          fi

          if [[ "$failed" == false ]] && ! compose "$IMAGE_TAG" up -d --remove-orphans; then
            failed=true
          fi
          if [[ "$failed" == false ]] && ! wait_for_healthy "$IMAGE_TAG"; then
            failed=true
          fi
          if [[ "$failed" == false ]] && ! verify_reverse_proxy "$IMAGE_TAG"; then
            failed=true
          fi

          if [[ "$failed" == true ]]; then
            compose "$IMAGE_TAG" ps || true
            compose "$IMAGE_TAG" logs --tail=200 || true

            database_restored=true
            compose "$IMAGE_TAG" stop web || true
            if [[ "$backup_created" == true ]] && ! compose "$IMAGE_TAG" run -T --rm --no-deps web \
              python -m app.maintenance restore "$backup_path" /app/data/app.db; then
              database_restored=false
            fi
            compose "$IMAGE_TAG" down || true
            restore_previous_compose

            if [[ "$database_restored" == false ]]; then
              echo "Deployment failed and the pre-deploy database could not be restored"
              exit 1
            fi

            if [[ "$had_previous_compose" == true && -n "$previous_tag" && "$previous_tag" != "$IMAGE_TAG" ]]; then
              echo "Deployment failed; rolling back to $previous_tag"
              rollback_ready=true
              if [[ "$previous_tag" =~ ^[0-9a-f]{40}$ ]] && ! compose "$previous_tag" pull; then
                rollback_ready=false
              fi
              if [[ "$rollback_ready" == true ]] && \
                 compose "$previous_tag" up -d --remove-orphans && \
                 wait_for_healthy "$previous_tag" && \
                 verify_reverse_proxy "$previous_tag"; then
                echo "Rollback to $previous_tag completed"
              else
                echo "Rollback to $previous_tag failed"
                compose "$previous_tag" ps || true
                compose "$previous_tag" logs --tail=200 || true
              fi
            else
              echo "Deployment failed and no complete previous release is available"
            fi
            exit 1
          fi

          mv restore-database.sh.next restore-database.sh
          chmod 700 restore-database.sh
          if [[ -f compose.prod.yml.rollback ]]; then
            mv compose.prod.yml.rollback compose.prod.yml.previous
          fi
          printf '%s\n' "$IMAGE_TAG" > .deployed-image-tag.tmp
          mv .deployed-image-tag.tmp .deployed-image-tag

          while IFS= read -r reference; do
            tag=${reference##*:}
            if [[ "$tag" != "$IMAGE_TAG" && "$tag" != "$previous_tag" ]]; then
              docker image rm "$reference" || true
            fi
          done < <(
            docker image ls \
              --filter "reference=$IMAGE_NAME:*" \
              --format '{{.Repository}}:{{.Tag}}'
          )
          docker image prune -f
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
