services:
  web:
    image: "crpi-yhz9m3hwh5p9orhs.cn-shanghai.personal.cr.aliyuncs.com/openshude/openshude-1:${IMAGE_TAG:?IMAGE_TAG is required}"

    container_name: openshude-web

    restart: unless-stopped

    cpus: 1.5
    mem_limit: 1200m
    mem_reservation: 768m
    pids_limit: 128

    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 4173
      DB_PATH: /app/data/app.db
      AVATAR_DIR: /app/data/avatars
      BACKUP_DIR: /app/backups
      APP_VERSION: "${IMAGE_TAG:?IMAGE_TAG is required}"
      DOCS_ENABLED: "false"
      MAX_CONCURRENT_REQUESTS: "50"
      REQUEST_QUEUE_TIMEOUT_SECONDS: "0.1"
      DATABASE_POOL_SIZE: "5"
      DATABASE_POOL_TIMEOUT_SECONDS: "2"
      LOGIN_PASSWORD_CONCURRENCY: "2"
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "7"
      AUTH_COOKIE_SECURE: "false"
      ALLOWED_HOSTS: '["39.96.36.207","127.0.0.1","localhost"]'
      ALLOWED_ORIGINS: '["http://39.96.36.207"]'

    ports:
      - "127.0.0.1:4173:4173"

    volumes:
      - openshude-data:/app/data
      - openshude-backups:/app/backups

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/health', timeout=4).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openshude-data:
    external: true
    name: openshude-data
  openshude-backups:
    external: true
    name: openshude-backups
